{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block public_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/logo_dark.png') }}" alt="Logo" style="height: 48px; width: 48px; object-fit: contain;">
      <h3 class="mt-2 fw-bold d-inline-block align-middle ms-2">Reset Password</h3>
      <p class="text-muted small mt-1">Enter your registered email and a new password.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="mb-3">
        <label class="form-label">Registered Email</label>
        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" minlength="6" placeholder="At least 6 characters" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" minlength="6" placeholder="Re-enter new password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Reset Password</button>
    </form>
    <p class="text-center mt-3 mb-0">
      Remember your password? <a href="{{ url_for('auth.login') }}">Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
